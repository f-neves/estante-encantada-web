[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Modo local: o site funciona sozinho, sem backend. Para apontar para uma API
  # publicada, troque para "0" e defina VITE_API_URL nas variáveis do Netlify.
  VITE_OFFLINE = "1"

# Aplicação de página única: qualquer rota cai no index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Os arquivos com hash no nome nunca mudam de conteúdo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Narração e capas: nomes estáveis, então cache longo com revalidação.
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
